<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACLt 协议剧场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one pixel-art side-scrolling stage (320x180 world, upscaled 4x), a caption rail with the host, then the stage list. Single committed night-sky look. */
:root{
  --night:#0d1324; --night-2:#161e36; --line:#2a3656; --paper:#F2EDE4; --mute:#8D97AB;
  --frost:#9FD0EE; --amber:#F2A65A; --clawd:#E8774A; --sage:#74C7A5; --coral:#EC6F5F; --ink:#0B0F1A;
  --fun:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:dark;
}
html{background:var(--night)}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:18px}
.top{display:grid;gap:8px}
.eyebrow{font-family:var(--px);font-size:10px;letter-spacing:.1em;color:var(--amber);line-height:1.8}
h1{font-family:var(--fun);font-weight:400;font-size:clamp(30px,5vw,50px);line-height:1.1;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--mute);max-width:68ch}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border:4px solid var(--line);border-radius:6px;overflow:hidden;background:var(--night);image-rendering:pixelated}
.stage canvas{display:block;width:100%;height:100%}
.start{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;padding:0 0 6%;background:linear-gradient(to top,rgba(8,11,24,.82),rgba(8,11,24,0) 55%);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font:inherit;color:var(--paper)}
.start span{display:grid;justify-items:center;gap:6px;padding:14px 26px;background:var(--clawd);color:var(--ink);box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--paper),0 8px 0 8px rgba(0,0,0,.35)}
.start b{font-family:var(--fun);font-weight:400;font-size:clamp(18px,2.6vw,26px)}
.start small{font-family:var(--px);font-size:9px;letter-spacing:.06em}
.start:hover span{background:#F59B6E}
.start:focus-visible span,.ctl button:focus-visible,.acts button:focus-visible,#scrub:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctl button{font-family:var(--fun);font-size:15px;background:var(--night-2);color:var(--paper);border:2px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;min-width:44px}
.ctl button:hover{border-color:var(--amber)}
.ctl button[aria-pressed="false"]{color:var(--mute);text-decoration:line-through}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--clawd)}
.time{font-family:var(--px);font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.caption{display:flex;gap:14px;align-items:flex-start;background:var(--night-2);border:2px solid var(--line);border-radius:6px;padding:14px 16px;min-height:96px}
.caption canvas{flex:0 0 auto;width:64px;height:64px;image-rendering:pixelated}
.caption .say{min-width:0;display:grid;gap:4px}
.who{font-family:var(--px);font-size:10px;color:var(--clawd);letter-spacing:.06em}
#line{font-family:var(--fun);font-size:19px;line-height:1.6;margin:0}
#ref{font-size:12px;color:var(--mute);margin:0}
.acts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.acts button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:transparent;color:var(--paper);border:2px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;font:inherit}
.acts button:hover{border-color:var(--mute)}
.acts button[aria-current="true"]{border-color:var(--clawd);background:var(--night-2)}
.acts .n{font-family:var(--px);font-size:9px;color:var(--amber);grid-row:span 2;padding-top:5px}
.acts .t{font-family:var(--fun);font-size:17px}
.acts .r{font-size:12px;color:var(--mute);min-width:0}
.note{font-size:13px;color:var(--mute);max-width:80ch;margin:0}
.note code{font-size:12px;color:var(--frost)}
@media (max-width:560px){#line{font-size:16px}.caption canvas{width:48px;height:48px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">ACLT PROTOCOL · PIXEL TOUR</div>
    <h1>ACLt 协议剧场</h1>
    <p class="lede">跟着 Claude 在像素世界里跑一圈：算力集市、剃刀与桥、冰封的约定、抽签验证、看不见的线……一个计算任务从约定到结算的冒险，大约两分半钟。</p>
  </header>

  <div class="stage">
    <canvas id="stage" role="img" aria-label="ACLt 像素动画，Claude 在画面中当导游"></canvas>
    <button class="start" id="start" type="button"><span><b>▶ 开始冒险</b><small>MUSIC + SFX · 2:30</small></span></button>
  </div>

  <div class="ctl" role="group" aria-label="播放控制">
    <button id="prev" type="button" aria-label="上一关">⏮</button>
    <button id="play" type="button" aria-label="播放">▶</button>
    <button id="next" type="button" aria-label="下一关">⏭</button>
    <input id="scrub" type="range" min="0" max="100" step="0.05" value="0" aria-label="播放进度">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="music" type="button" aria-pressed="true">♪ 配乐</button>
    <button id="sfx" type="button" aria-pressed="true">✦ 音效</button>
    <button id="speed" type="button" aria-label="播放速度">1×</button>
  </div>

  <div class="caption">
    <canvas id="avatar" width="64" height="64" aria-hidden="true"></canvas>
    <div class="say">
      <div class="who">CLAUDE · 导游</div>
      <p id="line"></p>
      <p id="ref"></p>
    </div>
  </div>

  <ol class="acts" id="acts"></ol>

  <p class="note">配乐和音效由浏览器 Web Audio 实时合成，点击开始后才会出声。画面里的约定内容、抽签人数和证据刻度都是示意，用来讲清思路；完整定义见仓库 <code>docs/</code> 下的规范文档。快捷键：空格 播放/暂停，← → 切换关卡。</p>
</div>
<script>
(() => {
"use strict";
/* ================= world & canvases ================= */
const W = 1280, H = 720, LW = 320, LH = 180, K = 4, GY = 148, ZW = 420, A = 1.6, TR = 1.6;
const Z = i => i * ZW;
const cv = document.getElementById("stage"), ctx = cv.getContext("2d");
const av = document.getElementById("avatar"), actx = av.getContext("2d");
const lo = document.createElement("canvas"); lo.width = LW; lo.height = LH;
const L = lo.getContext("2d");
const C = {
  ink: "#0B0F1A", paper: "#F2EDE4", mute: "#8D97AB", frost: "#9FD0EE", ice: "#BFE6FF", amber: "#F2A65A",
  gold: "#FFD166", sage: "#74C7A5", coral: "#EC6F5F", violet: "#B3A8E6", wood: "#8A5A3C", wood2: "#5E3C28",
  stone: "#5B6478", blue: "#6FA8DC",
};
const FONTS = { fun: '"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",sans-serif', px: '"Press Start 2P",ui-monospace,monospace', sans: '"Noto Sans SC","PingFang SC",sans-serif' };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let WT = 0;

/* ================= math ================= */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
const win = (t, a, b, f = .3) => E.out(P(t, a, a + f)) * (1 - E.in(P(t, b - f, b)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => (Math.imul(n | 0, 2654435761) >>> 0) % 997;
const qpt = (a, c, b, t) => { const u = 1 - t; return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }; };
const arc = (a, b, h, t) => qpt(a, { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - h }, b, t);
const SHADE = new Map();
function shade(hex, f) {
  const key = hex + f; if (SHADE.has(key)) return SHADE.get(key);
  const n = parseInt(hex.slice(1), 16), tgt = f > 0 ? 255 : 0, a = Math.abs(f);
  const ch = v => Math.round(v + (tgt - v) * a);
  const out = `rgb(${ch(n >> 16)},${ch(n >> 8 & 255)},${ch(n & 255)})`; SHADE.set(key, out); return out;
}

/* ================= pixel primitives (on L, world coords) ================= */
function R(x, y, w, h, c) { if (w <= 0 || h <= 0) return; L.fillStyle = c; L.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
function bevel(x, y, w, h, c, hi, lo2) { R(x, y, w, h, c); R(x, y, w, 1, hi || shade(c, .3)); R(x, y, 1, h, hi || shade(c, .3)); R(x, y + h - 1, w, 1, lo2 || shade(c, -.35)); R(x + w - 1, y, 1, h, lo2 || shade(c, -.35)); }
function disc(cx, cy, r, c) { cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r); L.fillStyle = c; for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); L.fillRect(cx - w, cy + dy, 2 * w + 1, 1); } }
function ring(cx, cy, r, c) { cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r); L.fillStyle = c; let x = r, y = 0, e = 1 - r; while (x >= y) { for (const [a, b] of [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]]) L.fillRect(cx + a, cy + b, 1, 1); y++; if (e < 0) e += 2 * y + 1; else { x--; e += 2 * (y - x) + 1; } } }
function oval(cx, cy, rx, ry, c) { L.fillStyle = c; for (let k = 0; k < 96; k++) { const a = k / 96 * Math.PI * 2; L.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1); } }
function ln(x0, y0, x1, y1, c) { x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); L.fillStyle = c; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy, n = 0; while (n++ < 900) { L.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } }
function alpha(a, fn) { if (a <= 0) return; const o = L.globalAlpha; L.globalAlpha = o * Math.min(1, a); fn(); L.globalAlpha = o; }
function pop(cx, cy, s, fn) { if (s <= .02) return; L.save(); L.translate(cx, cy); L.scale(s, s); L.translate(-cx, -cy); fn(); L.restore(); }
const GL = {
  "?": ["111", "001", "011", "000", "010"], "!": ["1", "1", "1", "0", "1"], v: ["00001", "00010", "10100", "01000"],
  x: ["101", "010", "101"], heart: ["01010", "11111", "01110", "00100"], dots: ["10101"],
};
function glyph(g, x, y, c, s = 1) { GL[g].forEach((row, j) => [...row].forEach((ch, i) => { if (ch === "1") R(x + i * s, y + j * s, s, s, c); })); }
function sparkle(x, y, c = C.paper, big = false) { const k = big ? 2 : 1; R(x - k, y, 2 * k + 1, 1, c); R(x, y - k, 1, 2 * k + 1, c); }
function pbub(x, y, g, a = 1, col = C.ink) { alpha(a, () => { x = Math.round(x); y = Math.round(y); R(x - 4, y - 5, 9, 8, C.paper); R(x - 5, y - 4, 11, 6, C.paper); R(x - 1, y + 3, 2, 1, C.paper); R(x - 1, y + 4, 1, 1, C.paper); const w = GL[g][0].length, h = GL[g].length; glyph(g, x - Math.floor(w / 2), y - 1 - Math.floor(h / 2), col); }); }

/* ================= hi-res queues ================= */
const TQ = [], GQ = [], used = new Set();
function TX(s, x, y, o = {}) { s = String(s); for (const ch of s) used.add(ch); TQ.push({ s, x, y, o }); }
function GLOW(x, y, r, rgb, a) { GQ.push({ x, y, r, rgb, a }); }

/* ================= sprites ================= */
const blink = seed => ((WT + seed * .37) % 3.9) < .12;
function crit(x, y, o = {}) {
  x = Math.round(x); y = Math.round(y - (o.hop || 0));
  const c = o.c || C.sage, d = shade(c, -.4), hi = shade(c, .35);
  const st = o.walk ? Math.sin(WT * 14 + x) > 0 : null;
  alpha(o.a ?? 1, () => {
    R(x - 3, y - 3, 1, st === true ? 2 : 3, d); R(x + 2, y - 3, 1, st === false ? 2 : 3, d);
    R(x - 3, y - 5, 6, 2, shade(c, -.18));
    const top = y - 12;
    R(x - 5, top + 1, 10, 6, c); R(x - 4, top, 8, 1, hi); R(x - 4, top + 7, 8, 1, d);
    R(x - 4, top + 1, 8, 5, "#16243a");
    const ex = o.look ? Math.sign(o.look) : 0, e = o.eyes || "n", ec = o.ec || C.ice;
    if (e === "sleep") { R(x - 3, top + 4, 2, 1, ec); R(x + 1, top + 4, 2, 1, ec); }
    else if (e === "happy") { for (const b of [x - 3, x + 1]) { R(b, top + 3, 1, 1, ec); R(b + 1, top + 2, 1, 1, ec); R(b + 2, top + 3, 1, 1, ec); } }
    else if (e === "wow") { R(x - 3 + ex, top + 2, 2, 3, ec); R(x + 1 + ex, top + 2, 2, 3, ec); }
    else if (e === "x") { glyph("x", x - 4, top + 2, C.coral); glyph("x", x + 1, top + 2, C.coral); }
    else { const b = blink(x); R(x - 2 + ex, top + 2 + (b ? 2 : 0), 1, b ? 1 : 2, ec); R(x + 1 + ex, top + 2 + (b ? 2 : 0), 1, b ? 1 : 2, ec); }
    if (o.shades) R(x - 4, top + 2, 8, 2, "#05070d");
    if (o.mask) R(x - 4, top + 4, 8, 2, "#d8d2e8");
    if (o.ant) { R(x, top - 3, 1, 3, d); R(x - 1, top - 4, 3, 1, C.amber); }
  });
}
function reqr(x, y, o = {}) {
  x = Math.round(x); y = Math.round(y - (o.hop || 0));
  const c = C.blue, d = "#41709e", hi = "#a8cdf0", st = o.walk ? Math.sin(WT * 14) > 0 : null;
  R(x - 4, y - 2, 2, st === true ? 1 : 2, d); R(x + 2, y - 2, 2, st === false ? 1 : 2, d);
  const top = y - 15;
  R(x - 5, top, 10, 13, c); R(x - 6, top + 1, 12, 11, c); R(x - 5, top, 10, 1, hi); R(x - 6, top + 1, 1, 4, hi); R(x - 5, top + 12, 10, 1, d);
  const b = blink(3), lk = o.look ? Math.sign(o.look) : 0;
  R(x - 3 + lk, top + 4 + (b ? 2 : 0), 2, b ? 1 : 3, C.ink); R(x + 1 + lk, top + 4 + (b ? 2 : 0), 2, b ? 1 : 3, C.ink);
  R(x - 5, top + 8, 2, 1, "#e98a9a"); R(x + 3, top + 8, 2, 1, "#e98a9a");
  R(x - 3, top - 5, 6, 5, "#2b3550"); R(x - 5, top - 1, 10, 1, "#2b3550"); R(x - 3, top - 2, 6, 1, C.amber);
}
function orb(x, y, c = C.amber) { const b = Math.sin(WT * 3) * 1.2; disc(x, y + b, 3, c); R(x - 1, y - 2 + b, 1, 1, "#fff6d8"); GLOW(x, y + b, 14, "255,190,110", .5); }
function lockSpr(cx, cy, c = C.gold) { cx = Math.round(cx); cy = Math.round(cy); R(cx - 3, cy - 9, 1, 4, "#c9c9d6"); R(cx + 3, cy - 9, 1, 4, "#c9c9d6"); R(cx - 2, cy - 10, 5, 1, "#c9c9d6"); bevel(cx - 4, cy - 5, 9, 7, c, "#ffeab0", "#b8862e"); R(cx, cy - 3, 1, 3, "#5a3e10"); }
function iceBox(x, y, w, h, p, seed = 1) {
  if (p <= 0) return; const fw = w * p;
  alpha(.42, () => R(x, y, fw, h, C.ice));
  const r = rng(seed); for (let k = 0; k < 9; k++) { const sx = x + r() * w, sy = y + r() * h, l = 3 + r() * 8; if (sx + l > x + fw) continue; alpha(.8, () => ln(sx, sy, sx + l, sy - l, "#ffffff")); }
  if (p < 1) R(x + fw - 1, y, 1, h, "#ffffff");
  else { R(x, y, w, 1, "#e6f6ff"); R(x, y, 1, h, "#e6f6ff"); R(x, y + h - 1, w, 1, "#6fa3c8"); R(x + w - 1, y, 1, h, "#6fa3c8"); }
  GLOW(x + fw / 2, y + h / 2, Math.max(w, h) * .7, "160,215,250", .2 * p);
}
function hourglass(x, y, a, sand = "#f2d27a", frame = C.gold) {
  x = Math.round(x); y = Math.round(y); const g = "#9fd0ee";
  R(x, y, 5, 1, frame); R(x, y + 7, 5, 1, frame);
  R(x, y + 1, 1, 2, g); R(x + 4, y + 1, 1, 2, g); R(x + 1, y + 3, 1, 2, g); R(x + 3, y + 3, 1, 2, g); R(x, y + 5, 1, 2, g); R(x + 4, y + 5, 1, 2, g);
  const top = Math.round(clamp(a) * 2), bot = Math.round((1 - clamp(a)) * 2);
  if (top > 0) R(x + 1, y + 3 - top, 3, top, sand); if (bot > 0) R(x + 1, y + 7 - bot, 3, bot, sand);
  if (a > 0 && a < 1) R(x + 2, y + 4, 1, 1, sand);
}
function firework(cx, cy, t0, t, seed, cols) {
  const u = t - t0; if (u < 0 || u > 2.1) return;
  if (u < .4) { const y = lerp(GY, cy, E.out(u / .4)); R(cx, y, 1, 3, C.paper); R(cx, y + 3, 1, 2, C.amber); return; }
  const v = u - .4, r = rng(seed);
  for (let k = 0; k < 28; k++) { const ang = k / 28 * Math.PI * 2 + r() * .2, sp = 16 + r() * 18, al = 1 - v / 1.7; if (al <= 0) continue; const px = cx + Math.cos(ang) * sp * v, py = cy + Math.sin(ang) * sp * v + 14 * v * v; if (Math.sin(WT * 30 + k) > -.4) alpha(al, () => R(px, py, v < .3 ? 2 : 1, v < .3 ? 2 : 1, cols[k % cols.length])); }
  if (v < .3) GLOW(cx, cy, 34, "255,220,150", .55 * (1 - v / .3));
}
function smoke(x, y, on, col = "#8a8fb0", seed = 0) { if (!on) return; for (let k = 0; k < 3; k++) { const u = (WT * .55 + k / 3 + seed * .13) % 1; alpha(1 - u, () => disc(x + Math.sin(u * 6 + k + seed) * 2, y - u * 16, 1 + u * 2.4, col)); } }
function gearPx(x, y, rot, c) { const f = Math.floor(rot * 4) % 2; R(x - 1, y - 3, 3, 7, c); R(x - 3, y - 1, 7, 3, c); if (f) { R(x - 3, y - 3, 2, 2, c); R(x + 2, y - 3, 2, 2, c); R(x - 3, y + 2, 2, 2, c); R(x + 2, y + 2, 2, 2, c); } R(x, y, 1, 1, "#16243a"); }
function coinPx(x, y, ph = 0) { const w = Math.max(1, Math.round(Math.abs(Math.cos(WT * 5 + ph)) * 3)); R(x - w, y - 3, 2 * w + 1, 7, C.gold); R(x - w, y - 3, 1, 7, "#fff1b8"); GLOW(x, y, 10, "255,210,100", .4); }

/* ================= Clawd (the host) ================= */
function clawd(o) {
  const body = "#E8774A", hi = "#F59B6E", lo2 = "#C25B31", eye = "#2a140a";
  const sq = o.squash || 0, bw = 24 + Math.round(sq * 4), bh = 16 - Math.round(sq * 3), legH = o.air ? 4 : 6;
  const talkB = o.talk > .1 && Math.sin(WT * 20) > 0 ? 1 : 0;

const $ = id => document.getElementById(id);
const lineEl = $("line"), refEl = $("ref"), timeEl = $("time"), scrub = $("scrub"), playBtn = $("play");
let startBtn = $("start");
scrub.max = TOTAL.toFixed(2);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
let lastLine = null, lastAct = -1;
const acts = $("acts");
S.forEach((s, i) => { const li = document.createElement("li"), b = document.createElement("button"); b.type = "button"; b.innerHTML = `<span class="n">${i === 0 ? "GO" : "0" + i}</span><span class="t"></span><span class="r"></span>`; b.querySelector(".t").textContent = s.name; b.querySelector(".r").textContent = s.sub; b.addEventListener("click", () => { seek(starts[i] + .001); setPlaying(true); }); li.appendChild(b); acts.appendChild(li); });
const actBtns = [...acts.querySelectorAll("button")];
function seek(g) { GT = clamp(g, 0, TOTAL - .001); jumped = true; started = true; dropStart(); }
function dropStart() { if (startBtn) { startBtn.hidden = true; startBtn.remove(); startBtn = null; } }

function render() {
  const { i, t } = locate(GT), sc = S[i];
  const cam = Math.round(camAt(i, t)), sh = shakeAt(sc, t);
  TQ.length = 0; GQ.length = 0;
  L.setTransform(1, 0, 0, 1, 0, 0); L.globalAlpha = 1; bg(cam);
  L.setTransform(1, 0, 0, 1, -cam + sh.x, sh.y); ground(cam);
  for (let j = 0; j <= i; j++) { const vis = Z(j) + ZW > cam - 20 && Z(j) < cam + LW + 20; if (vis || j === i) { try { S[j].draw(j === i ? t : S[j].dur); } catch (e) { console.error(e); } L.globalAlpha = 1; } }
  const pose = poseAt(i, t), cue = started ? cueAt(sc, t) : null;
  const talkLen = cue ? Math.min(cue.say.length / 9, 4.5) : 0;
  pose.talk = cue && playing ? clamp(1 - P(t, cue.at + talkLen, cue.at + talkLen + .3)) * P(t, cue.at, cue.at + .1) : 0;
  const head = clawd(pose);
  L.setTransform(1, 0, 0, 1, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0); ctx.imageSmoothingEnabled = false; ctx.drawImage(lo, 0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  for (const g of GQ) { const X = (g.x - cam + sh.x) * K, Y = (g.y + sh.y) * K, r = g.r * K; const gr = ctx.createRadialGradient(X, Y, 0, X, Y, r); gr.addColorStop(0, `rgba(${g.rgb},${g.a})`); gr.addColorStop(1, `rgba(${g.rgb},0)`); ctx.fillStyle = gr; ctx.fillRect(X - r, Y - r, 2 * r, 2 * r); }
  ctx.globalCompositeOperation = "source-over";
  for (const q of TQ) drawText(q, cam, sh);
  // stage card
  if (i > 0 && started) { const a = win(t, TR - .2, TR + 3, .35), dx = (1 - E.out(P(t, TR - .2, TR + .2))) * -300; if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.ink; ctx.fillRect(28 + dx, 28, 330, 76); ctx.fillStyle = C.clawd || "#E8774A"; ctx.fillRect(28 + dx, 28, 8, 76); ctx.font = `12px ${FONTS.px}`; ctx.fillStyle = C.amber; ctx.textBaseline = "middle"; ctx.fillText(`STAGE ${i}`, 52 + dx, 50); ctx.font = `28px ${FONTS.fun}`; ctx.fillStyle = C.paper; ctx.fillText(sc.name, 52 + dx, 80); ctx.restore(); } }
  if (cue) { const a = P(t, cue.at, cue.at + .25) * (1 - P(t, cue.end - .25, cue.end)); drawBubble((pose.x - cam + sh.x) * K, (head.top + sh.y) * K, cue.b, (t - cue.at) * 16, a); }
  const fl = flashAt(sc, t); if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * .8})`; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = .22; ctx.fillStyle = scan; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // avatar
  const ad = Math.round(av.clientWidth * Math.min(window.devicePixelRatio || 1, 2)) || 64; if (av.width !== ad) { av.width = ad; av.height = ad; }
  L.setTransform(1, 0, 0, 1, 0, 0); L.clearRect(0, 0, 40, 40); GQ.length = 0;
  L.save(); L.beginPath(); L.rect(0, 0, 40, 40); L.clip(); L.fillStyle = "#161e36"; L.fillRect(0, 0, 40, 40); clawd({ x: 20, y: 32, talk: pose.talk, eyes: pose.eyes, wave: pose.wave, since: 9 }); L.restore();
  actx.imageSmoothingEnabled = false; actx.clearRect(0, 0, av.width, av.height); actx.drawImage(lo, 0, 0, 40, 40, 0, 0, av.width, av.height);
  // captions
  const text = !started ? "点“开始冒险”，我们就出发！" : cue ? (playing ? [...cue.say].slice(0, Math.floor((t - cue.at) * 24) + 1).join("") : cue.say) : "";
  if (text !== lastLine) { lineEl.textContent = text; lastLine = text; }
  if (i !== lastAct) { refEl.textContent = `${i === 0 ? "开场" : "STAGE " + i} · ${sc.name} · 相关文档：${sc.ref}`; actBtns.forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false")); lastAct = i; }
  timeEl.textContent = `${fmt(started ? GT : 0)} / ${fmt(TOTAL)}`;
  if (document.activeElement !== scrub) scrub.value = (started ? GT : 0).toFixed(2);

}
function setPlaying(v) {

}
function frame(now) {

  if (playing) {

playBtn.addEventListener("click", () => setPlaying(!playing));
startBtn.addEventListener("click", () => setPlaying(true));
cv.addEventListener("click", () => setPlaying(!playing));
$("prev").addEventListener("click", () => { const { i, t } = locate(GT); seek(starts[t > 2 || i === 0 ? i : i - 1] + .001); });
$("next").addEventListener("click", () => { const { i } = locate(GT); if (i < S.length - 1) seek(starts[i + 1] + .001); });
$("speed").addEventListener("click", e => { speed = speed === 1 ? 1.5 : speed === 1.5 ? .75 : 1; e.currentTarget.textContent = speed + "×"; });
["music", "sfx"].forEach(k => $(k).addEventListener("click", e => { SND.init(); e.currentTarget.setAttribute("aria-pressed", String(SND.toggle(k))); }));

addEventListener("keydown", e => {
  if (e.target instanceof HTMLInputElement && e.key !== " ") return;
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") $("next").click();
  else if (e.key === "ArrowLeft") $("prev").click();

/* fonts: request exactly the glyphs the canvas uses */
let fontChars = "";
function loadFonts() {
  const all = [...used].join(""); if (all === fontChars || !document.fonts) return; fontChars = all;
  Promise.all([`20px "ZCOOL KuaiLe"`, `12px "Press Start 2P"`, `20px "Noto Sans SC"`].map(f => document.fonts.load(f, all).catch(() => null)));
}
setInterval(loadFonts, 1200);
(() => { S.forEach(s => { for (let t = 0; t <= s.dur; t += .5) { try { s.draw(t); } catch (e) { console.error(e); } } s.cues.forEach(c => { for (const ch of c.b + c.say) used.add(ch); }); }); for (const ch of "STAGE0123456789点开始冒险我们就出发") used.add(ch); TQ.length = 0; GQ.length = 0; loadFonts(); })();

setPlaying(false);
requestAnimationFrame(t => { last = t; frame(t); });

})();
