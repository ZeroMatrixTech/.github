<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ubuntu_ZeroMatrix 安装演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a step rail on top, one "monitor" in the middle that switches between terminal, GRUB, installer and desktop, and an explainer column beside it. Single dark look. */
:root{--bg:#0F1218;--panel:#161B23;--line:#2A323E;--ink:#E6EAF0;--muted:#8F9AA8;--accent:#E95420;--ok:#5FD39B;--warn:#F2C46B;--term:#0A0C10;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--body:"Noto Sans SC","PingFang SC",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 48px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top a{color:var(--muted);text-decoration:none;font-size:14px}
.top a:hover{color:var(--ink)}
.top h1{font-size:22px;margin:0 auto 0 0}
.badge{font-family:var(--mono);font-size:12px;color:var(--warn);border:1px solid #5a4718;background:#2a220e;border-radius:999px;padding:2px 10px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px;list-style:none;padding:0}
.steps button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;display:grid;gap:2px}
.steps b{font-family:var(--mono);font-size:12px;color:var(--muted)}
.steps span{color:var(--ink);font-weight:500}
.steps button[aria-current="true"]{border-color:var(--accent);background:#23160f}
.steps button[aria-current="true"] b{color:var(--accent)}
.steps button.done b::after{content:" ✓";color:var(--ok)}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.monitor{background:#05070a;border:10px solid #232a35;border-radius:14px;aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.screen{position:absolute;inset:0;padding:18px 20px;font-family:var(--mono);font-size:13.5px;line-height:1.7;overflow:auto}
.term{background:var(--term);color:#d8dee8}
.term .p{color:var(--ok)}
.term .dim{color:#6f7a88}
.term .okk{color:var(--ok)}
.term .hl{color:var(--warn)}
.cursor{display:inline-block;width:8px;height:15px;background:#d8dee8;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.grub{background:#000;color:#ddd;display:flex;flex-direction:column}
.grub .menu{border:1px solid #bbb;padding:8px 0;margin-top:18px}
.grub .item{padding:1px 14px;cursor:pointer;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.grub .item.sel{background:#ccc;color:#000}
.grub .help{margin-top:auto;color:#aaa;font-size:12.5px;white-space:normal}
.grub .edit{border:1px solid #bbb;padding:10px 14px;margin-top:18px;white-space:pre-wrap;word-break:break-all}
.tok{cursor:pointer;border-radius:2px}
.tok.del{background:#7a2a1a;color:#ffb39e;text-decoration:line-through}
.tok.target{outline:1px dashed var(--warn);outline-offset:1px}
.inst{background:linear-gradient(160deg,#2c001e,#5e2750 55%,#e95420 160%);color:#fff;font-family:var(--body);display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;text-align:center}
.inst h3{margin:0;font-size:20px}
.bar{width:min(420px,80%);height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .3s}
.inst .log{font-family:var(--mono);font-size:12px;opacity:.85;min-height:3.4em}
.desk{background:radial-gradient(circle at 70% 30%,#5e2750,#2c001e 70%);font-family:var(--body);padding:0;display:flex;flex-direction:column}
.desk .topbar{height:24px;background:#111;color:#ddd;font-size:12px;display:flex;align-items:center;justify-content:center}
.desk .win{margin:18px auto;width:86%;flex:1;background:#1e1e1e;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.desk .wbar{background:#2d2d2d;color:#ccc;font-size:12px;padding:5px 10px}
.desk .wbody{display:grid;grid-template-columns:150px 1fr;flex:1;min-height:0}
.desk .tree{background:#252526;color:#bbb;font-family:var(--mono);font-size:12px;padding:8px 10px;line-height:1.8}
.desk .ed{font-family:var(--mono);font-size:12px;color:#d4d4d4;padding:8px 12px;line-height:1.8;overflow:auto}
.kw{color:#569cd6}.st{color:#ce9178}.cm{color:#6a9955}
.side{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{font-size:17px;margin:0 0 6px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.steps button:focus-visible,.grub .item:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px}
.check li{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.check li::before{content:"○";color:var(--line)}
.check li.on{color:var(--ink)}
.check li.on::before{content:"●";color:var(--ok)}
code{font-family:var(--mono);font-size:12.5px;color:#cfe3ff}
.foot{margin-top:18px;color:var(--muted);font-size:13px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.screen{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="../../index.html#ubuntu-zeromatrix">← 项目导航</a>
    <h1>ubuntu_ZeroMatrix 安装演示</h1>
    <span class="badge">模拟演示 · 0.2.0-rc3</span>
  </div>
  <ol class="steps" id="steps">
    <li><button type="button" data-s="0"><b>STEP 1</b><span>构建镜像</span></button></li>
    <li><button type="button" data-s="1"><b>STEP 2</b><span>启动菜单</span></button></li>
    <li><button type="button" data-s="2"><b>STEP 3</b><span>安装系统</span></button></li>
    <li><button type="button" data-s="3"><b>STEP 4</b><span>首次登录</span></button></li>
  </ol>
  <div class="main">
    <div class="monitor" id="monitor" aria-live="polite">
      <div class="screen term" id="s0"></div>
      <div class="screen grub" id="s1" hidden tabindex="0"></div>
      <div class="screen inst" id="s2" hidden></div>
      <div class="screen desk" id="s3" hidden></div>
    </div>
    <div class="side" id="side"></div>
  </div>
  <p class="foot">本页按仓库 README、<code>scripts/build-online.py</code> 与验收文档模拟流程，不运行真实构建，不下载镜像。真实构建首次需要较长时间和约 60 GB 空间；安装阶段必须联网。当前基线已在 VirtualBox 跑通，实体机、UEFI / Secure Boot 与 WSL2 构建仍需分别验收。</p>
</div>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let step = 0, done = [false, false, false, false], busy = false;
const SIDE = [
  { h: "在 Linux / WSL2 上构建", p: "构建不需要 root，也不会修改宿主机的软件源。原始 ISO 已展开进仓库，大文件通过 Git LFS 获取。", list: ["make iso-vm：虚拟机基线（默认）", "make iso-physical：实体机基线", "make verify-iso：校验已有镜像"], btn: "运行 make iso-vm" },
  { h: "选择启动入口", p: "当前在 VirtualBox 跑通的路径：选 normal graphics 入口，按 E，只删除 quiet splash，按 Ctrl+X 启动。", list: ["↑ ↓ 选择，E 编辑，Ctrl+X 启动", "保留 autoinstall 与 autoinstallpath 参数", "点击屏幕上的 quiet、splash 即可删除"], btn: null },
  { h: "安装并联网配置", p: "按安装器提示选择语言、磁盘和用户。晚期配置会联网安装开发工具和 VS Code，失败会让安装报告失败。", list: ["日志：/var/log/zeromatrix/provision.log", "断网失败后可在目标系统重试 provision-online.sh"], btn: "开始安装" },
  { h: "首次登录", p: "首次登录联网获取锁定版本的扩展和指定提交的 ACLt，创建工作区与 Python 虚拟环境，然后自动打开 VS Code。", list: ["先确认 /var/log/zeromatrix/provision-complete 存在", "C++ GDB、Python debugpy、Rust LLDB 分别按 F5 验证"], btn: "登录" },
];
function side() {
  const s = SIDE[step];
  $("side").innerHTML = "";
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<h2></h2><p></p><ul></ul>`;
  c.querySelector("h2").textContent = s.h; c.querySelector("p").textContent = s.p;
  s.list.forEach(t => { const li = document.createElement("li"); li.textContent = t; c.querySelector("ul").append(li); });
  $("side").append(c);
  const b = document.createElement("div"); b.className = "card btns";
  if (s.btn) { const x = document.createElement("button"); x.className = "btn"; x.textContent = s.btn; x.disabled = busy || done[step]; x.addEventListener("click", run); b.append(x); }
  if (step < 3) { const n = document.createElement("button"); n.className = "btn ghost"; n.textContent = "下一步 →"; n.disabled = !done[step]; n.addEventListener("click", () => go(step + 1)); b.append(n); }
  else { const r = document.createElement("button"); r.className = "btn ghost"; r.textContent = "从头再来"; r.addEventListener("click", reset); b.append(r); }
  $("side").append(b);
  if (step === 3) { const k = document.createElement("div"); k.className = "card"; k.innerHTML = `<h2>验收清单</h2><ul class="check" id="check"></ul>`; $("side").append(k); CHECK.forEach((t, i) => { const li = document.createElement("li"); li.textContent = t; if (checks[i]) li.className = "on"; k.querySelector("ul").append(li); }); }
}
function go(n) {
  if (busy) return; step = n;
  document.querySelectorAll("#steps button").forEach((b, i) => { b.setAttribute("aria-current", String(i === n)); b.classList.toggle("done", done[i]); });
  [0, 1, 2, 3].forEach(i => $("s" + i).hidden = i !== n);
  if (n === 0 && !done[0]) term0();
  if (n === 1) grub();
  if (n === 2 && !done[2]) inst0();
  if (n === 3) desk();
  side();
  if (n === 1) $("s1").focus({ preventScroll: true });
}
document.querySelectorAll("#steps button").forEach(b => b.addEventListener("click", () => go(+b.dataset.s)));
async function run() { if (busy) return; busy = true; side(); try { if (step === 0) await build(); if (step === 2) await install(); if (step === 3) await login(); } finally { busy = false; side(); } }

/* STEP 1: build */
function line(html, el = $("s0")) { const d = document.createElement("div"); d.innerHTML = html; el.append(d); el.scrollTop = el.scrollHeight; return d; }
function term0() { $("s0").innerHTML = ""; line('<span class="dim"># ubuntu_ZeroMatrix · 构建机（模拟）</span>'); line('<span class="p">~/ubuntu_ZeroMatrix$</span> git lfs pull'); line('<span class="dim">Downloading LFS objects: 100% … done</span>'); line('<span class="p">~/ubuntu_ZeroMatrix$</span> <span class="cursor"></span>'); }
async function build() {
  const s = $("s0"); s.lastChild.remove();
  line('<span class="p">~/ubuntu_ZeroMatrix$</span> make iso-vm');
  await sleep(500); line("Profile=vm, version=0.2.0-rc3, base=base/media");
  const stages = ["校验源目录清单 base/tree-manifest.json", "在私有用户命名空间中解包系统层（无需 root）", "APT 按包裁剪", "重新压缩 zeromatrix.squashfs", "生成安装源清单", "写入 BIOS / UEFI 引导记录，生成 ISO"];
  for (let i = 0; i < stages.length; i++) {
    const d = line(`<span class="hl">[${i + 1}/6]</span> ${stages[i]} <span class="dim">…</span>`);
    let dots = ""; for (let k = 0; k < 6; k++) { await sleep(110 + i * 25); dots += "."; d.querySelector(".dim").textContent = " " + dots; }
    d.insertAdjacentHTML("beforeend", ' <span class="okk">ok</span>');
  }
  await sleep(300);
  line('<span class="okk">✔</span> dist/zeromatrix-0.2.0-rc3-vm-amd64.iso');
  line('<span class="okk">✔</span> dist/zeromatrix-0.2.0-rc3-vm-amd64.iso.sha256');
  line('<span class="dim"># 以上为模拟输出；真实首次构建耗时较长。</span>');
  line('<span class="p">~/ubuntu_ZeroMatrix$</span> <span class="cursor"></span>');
  done[0] = true; document.querySelector('#steps button[data-s="0"]').classList.add("done");
}

/* STEP 2: GRUB */
const ENTRIES = ["Install ZeroMatrix vm (safe graphics, online)", "Install ZeroMatrix vm (normal graphics, online)", "Try or Install Ubuntu", "Ubuntu (safe graphics)", "Boot from next volume", "UEFI Firmware Settings"];
let sel = 0, editing = false, removed = new Set(), booted = false;
const kernel = i => `linux /casper/vmlinuz layerfs-path=zeromatrix.live.squashfs autoinstall subiquity.autoinstallpath=cdrom/autoinstall.yaml ${i === 0 ? "nomodeset " : ""}--- quiet splash`;
function grub() {
  const s = $("s1"); s.innerHTML = "";
  const head = document.createElement("div"); head.style.textAlign = "center"; head.textContent = "GNU GRUB  version 2.12"; s.append(head);
  if (!editing) {
    const m = document.createElement("div"); m.className = "menu";
    ENTRIES.forEach((t, i) => { const d = document.createElement("div"); d.className = "item" + (i === sel ? " sel" : ""); d.textContent = (i === sel ? "*" : " ") + t; d.addEventListener("click", () => { sel = i; grub(); }); d.addEventListener("dblclick", () => { sel = i; editing = true; grub(); }); m.append(d); });
    s.append(m);
    const h = document.createElement("div"); h.className = "help"; h.textContent = booted ? "已启动安装器，进入下一步。" : "使用 ↑ ↓ 选择入口。按 E 编辑启动参数，按 Enter 直接启动。（也可以双击入口进入编辑）"; s.append(h);
  } else {
    const e = document.createElement("div"); e.className = "edit";
    const pre = document.createElement("div"); pre.textContent = "setparams '" + ENTRIES[sel] + "'\n\n set gfxpayload=keep\n "; e.append(pre);
    const ln = document.createElement("div");
    kernel(sel).split(" ").forEach((tok, i) => {
      const sp = document.createElement("span"); sp.textContent = tok; sp.className = "tok" + (removed.has(i) ? " del" : "") + ((tok === "quiet" || tok === "splash") && !removed.has(i) ? " target" : "");
      sp.title = "点击删除 / 恢复"; sp.addEventListener("click", () => { removed.has(i) ? removed.delete(i) : removed.add(i); grub(); });
      ln.append(sp, document.createTextNode(" "));
    });
    e.append(ln);
    const post = document.createElement("div"); post.textContent = " initrd /casper/initrd"; e.append(post);
    s.append(e);
    const h = document.createElement("div"); h.className = "help";
    const toks = kernel(sel).split(" "), qi = toks.indexOf("quiet"), si = toks.indexOf("splash");
    const ok = removed.has(qi) && removed.has(si) && [...removed].every(i => i === qi || i === si);
    h.textContent = ok ? "参数已按已验证路径修改。按 Ctrl+X 启动。" : "点击 quiet 和 splash 删除它们（其他参数保留），然后按 Ctrl+X 启动；Esc 返回菜单。";
    s.append(h);
    const b = document.createElement("div"); b.className = "btns"; b.style.marginTop = "10px";
    const x = document.createElement("button"); x.className = "btn"; x.textContent = "Ctrl+X 启动"; x.addEventListener("click", bootIt);
    const esc = document.createElement("button"); esc.className = "btn ghost"; esc.textContent = "Esc 返回"; esc.addEventListener("click", () => { editing = false; grub(); });
    b.append(x, esc); s.append(b);
  }
}
function bootIt() {
  const toks = kernel(sel).split(" "), keep = ["autoinstall", "subiquity.autoinstallpath=cdrom/autoinstall.yaml"].every(k => !removed.has(toks.indexOf(k)));
  const s = $("s1"); const h = s.querySelector(".help");
  if (sel > 1) { h.textContent = "这是原版 Ubuntu 入口。演示中请选 ZeroMatrix 入口。"; return; }
  if (!keep) { h.textContent = "autoinstall 相关参数被删掉了，ZeroMatrix 配置不会加载。请保留它们，只删 quiet splash。"; return; }
  if (sel === 0 && !removed.has(toks.indexOf("quiet"))) { h.textContent = "safe graphics 入口可用，但已验证路径是 normal graphics 入口并删去 quiet splash。"; }
  booted = true; editing = false; done[1] = true; document.querySelector('#steps button[data-s="1"]').classList.add("done");
  s.innerHTML = '<div style="margin:auto;text-align:center;color:#ccc">[    0.000000] Linux version …<br>Booting ZeroMatrix live installer…</div>'; side();
}
$("s1").addEventListener("keydown", e => {
  if (step !== 1 || booted) return;
  if (!editing && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : ENTRIES.length - 1)) % ENTRIES.length; grub(); }
  else if (!editing && (e.key === "e" || e.key === "E")) { e.preventDefault(); editing = true; grub(); }
  else if (!editing && e.key === "Enter") { e.preventDefault(); editing = false; bootIt(); }
  else if (editing && e.key === "Escape") { editing = false; grub(); }
  else if (editing && e.ctrlKey && (e.key === "x" || e.key === "X")) { e.preventDefault(); bootIt(); }
});

/* STEP 3: install */
function inst0() { $("s2").innerHTML = '<h3>安装 ZeroMatrix</h3><div>语言 · 中文（简体）　磁盘 · 80 GB VirtualBox 磁盘　用户 · dev</div><div class="bar"><i id="pb"></i></div><div class="log" id="ilog">准备就绪</div>'; }
async function install() {
  const L = ["复制系统文件", "配置引导", "late-commands：联网安装开发工具（Ubuntu 仓库）", "late-commands：从 Microsoft 官方签名 APT 仓库获取 VS Code", "写入 /var/log/zeromatrix/provision.log", "写入 /var/log/zeromatrix/provision-complete"];
  for (let i = 0; i < L.length; i++) { $("ilog").textContent = L[i] + " …"; for (let k = 0; k < 5; k++) { await sleep(150); $("pb").style.width = ((i * 5 + k + 1) / (L.length * 5) * 100) + "%"; } }
  $("ilog").textContent = "安装完成：弹出 ISO 后重启"; done[2] = true; document.querySelector('#steps button[data-s="2"]').classList.add("done");
}

/* STEP 4: first login */
const CHECK = ["provision-complete 存在", "锁定版本扩展已安装", "ACLt 指定提交已获取", "~/workspace/ZeroMatrixTech 与 .venv 已创建", "C++ · GDB 调试（F5）", "Python · debugpy 调试（F5）", "Rust · LLDB 调试（F5）"];
let checks = CHECK.map(() => false);
function desk() {
  $("s3").innerHTML = `<div class="topbar">ZeroMatrix · ${done[3] ? "dev" : "登录"}</div>` + (done[3] || busy ? `<div class="win"><div class="wbar">ZeroMatrixTech — Visual Studio Code</div><div class="wbody"><div class="tree">▾ ZeroMatrixTech<br>&nbsp;&nbsp;▸ ACLt<br>&nbsp;&nbsp;▸ examples<br>&nbsp;&nbsp;&nbsp;&nbsp;cpp/<br>&nbsp;&nbsp;&nbsp;&nbsp;python/<br>&nbsp;&nbsp;&nbsp;&nbsp;rust/<br>&nbsp;&nbsp;.venv</div><div class="ed" id="ed"></div></div></div>` : `<div style="margin:auto;text-align:center;color:#fff"><div style="width:64px;height:64px;border-radius:50%;background:#e95420;margin:0 auto 10px"></div>dev<br><span style="opacity:.7;font-size:13px">点右侧“登录”</span></div>`);
}
async function login() {
  desk(); const ed = $("ed"), add = h => { const d = document.createElement("div"); d.innerHTML = h; ed.append(d); ed.scrollTop = ed.scrollHeight; };
  const tick = async i => { checks[i] = true; const li = document.querySelectorAll("#check li")[i]; if (li) li.className = "on"; await sleep(380); };
  add('<span class="cm">$ cat /var/log/zeromatrix/provision-complete</span>'); await sleep(400); add("provision complete"); await tick(0);
  add('<span class="cm"># zeromatrix-first-login</span>'); await sleep(300); add("扩展：按锁定版本安装 … ok"); await tick(1);
  add("ACLt：检出指定提交 … ok"); await tick(2); add("工作区与 Python .venv … ok"); await tick(3);
  add('<span class="kw">int</span> main() { std::cout &lt;&lt; <span class="st">"hello"</span>; }  <span class="cm">// F5 · GDB</span>'); await tick(4);
  add('<span class="kw">print</span>(<span class="st">"hello"</span>)  <span class="cm"># F5 · debugpy</span>'); await tick(5);
  add('<span class="kw">fn</span> main() { println!(<span class="st">"hello"</span>); }  <span class="cm">// F5 · LLDB</span>'); await tick(6);
  done[3] = true; document.querySelector('#steps button[data-s="3"]').classList.add("done");
}
